<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Railway Track Allocation - Banker’s Algorithm</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #f4f6f9;
}

header {
    background: #2c3e50;
    color: white;
    padding: 15px;
    text-align: center;
}

.container {
    padding: 20px;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

input {
    padding: 8px;
    margin: 5px;
}

button {
    padding: 10px;
    background: #3498db;
    color: white;
    border: none;
    cursor: pointer;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #ddd;
    padding: 10px;
    text-align: center;
}

th {
    background: #3498db;
    color: white;
}

.safe { color: green; font-weight: bold; }
.unsafe { color: red; font-weight: bold; }
</style>
</head>

<body>

<header>
🚆 Railway Track Allocation (Banker’s Algorithm)
</header>

<div class="container">

<div class="card">
<h3>Add Train</h3>
<input id="name" placeholder="Train Name">
<input id="alloc" type="number" placeholder="Allocated Tracks">
<input id="max" type="number" placeholder="Max Needed">
<button onclick="addProcess()">Add</button>
</div>

<div class="card">
<h3>Available Tracks</h3>
<input id="available" type="number" placeholder="Total Available">
<button onclick="runBanker()">Run Banker’s Algorithm</button>
</div>

<div class="card">
<h3>Process Table</h3>
<table>
<thead>
<tr>
<th>Train</th>
<th>Allocation</th>
<th>Max</th>
<th>Need</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>

<div class="card">
<h3>Result</h3>
<p id="result"></p>
<p id="sequence"></p>
</div>

</div>

<script>

let processes = [];

function addProcess() {
    let name = document.getElementById("name").value;
    let alloc = parseInt(document.getElementById("alloc").value);
    let max = parseInt(document.getElementById("max").value);

    if (!name || isNaN(alloc) || isNaN(max)) {
        alert("Enter valid data");
        return;
    }

    if (alloc > max) {
        alert("Allocation cannot exceed Max");
        return;
    }

    processes.push({
        name,
        alloc,
        max,
        need: max - alloc
    });

    display();
}

function display() {
    let table = document.getElementById("table");
    table.innerHTML = "";

    processes.forEach(p => {
        table.innerHTML += `
        <tr>
            <td>${p.name}</td>
            <td>${p.alloc}</td>
            <td>${p.max}</td>
            <td>${p.need}</td>
        </tr>`;
    });
}

function runBanker() {
    let available = parseInt(document.getElementById("available").value);

    if (isNaN(available)) {
        alert("Enter available tracks");
        return;
    }

    let work = available;
    let finish = new Array(processes.length).fill(false);
    let safeSeq = [];

    let count = 0;

    while (count < processes.length) {
        let found = false;

        for (let i = 0; i < processes.length; i++) {
            if (!finish[i] && processes[i].need <= work) {
                
                work += processes[i].alloc;
                safeSeq.push(processes[i].name);
                finish[i] = true;
                found = true;
                count++;
            }
        }

        if (!found) break;
    }

    let result = document.getElementById("result");
    let seq = document.getElementById("sequence");

    if (count === processes.length) {
        result.innerHTML = "<span class='safe'>SAFE STATE</span>";
        seq.innerHTML = "Safe Sequence: " + safeSeq.join(" → ");
    } else {
        result.innerHTML = "<span class='unsafe'>UNSAFE STATE (Deadlock Possible)</span>";
        seq.innerHTML = "No Safe Sequence Found";
    }
}

</script>

</body>
</html>
